[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-macro-intelligence"
version = "1.0.0"
description = "Offline-first, point-in-time gold research toolkit"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
gmi = "gmi.__main__:main"

[tool.setuptools.packages.find]
include = ["gmi*"]
